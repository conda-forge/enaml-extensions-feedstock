{% set name = "enaml-extensions" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: ae94152c6de79cdd81e90b5fca9b0ec3690a0b01bcdfa057845e4b11152b3872

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.27
    - hatch-vcs >=0.5
  run:
    - python >={{ python_min }}
    - atom >=0.12
    - enaml >=0.19
    - numpy >=1.26
    - qtpy >=2.4

test:
  requires:
    - python {{ python_min }}
  imports:
    - enamlext

about:
  home: https://github.com/gabrielcnr/enaml-extensions
  summary: Extra widgets and extensions for building UIs with Enaml
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gabrielcnr
