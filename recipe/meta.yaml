{% set name = "enaml-extensions" %}
{% set version = "0.6.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: a389ed23c6fa2be9134e26f8e6a960690f0e1ff1ed1b70b3abe6b29dcdb0a84e

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - python {{ python_min }}
    - hatchling >=1.27
    - hatch-vcs >=0.5
  run:
    - python >={{ python_min }}
    - atom >=0.12
    - enaml >=0.19
    - numpy >=1.26
    - qtpy >=2.4

test:
  requires:
    - python {{ python_min }}
  imports:
    - enamlext

about:
  home: https://github.com/gabrielcnr/enaml-extensions
  summary: Extra widgets and extensions for building UIs with Enaml
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - gabrielcnr
